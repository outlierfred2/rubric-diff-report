<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rubric Diff Report</title>
<meta name="description" content="Compare two versions of a rubric and open or download a standalone HTML diff report.">
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<header><div class="bar"><span class="logo" aria-hidden="true">±</span><strong>Rubric Diff Report</strong><span class="private">● &nbsp; Local comparison</span></div></header>
<main>
<div class="intro">
<p class="eyebrow">RUBRIC COMPARISON</p>
<h1>Compare rubrics.</h1>
</div>
<form id="comparison">
<div class="editors">
<div class="editor"><label for="original"><span class="tag">01</span> Original rubric</label><textarea id="original" placeholder="Paste your original rubric here…" spellcheck="false"></textarea><div class="count" id="original-count">0 lines</div></div>
<div class="editor"><label for="updated"><span class="tag">02</span> Updated rubric</label><textarea id="updated" placeholder="Paste your updated rubric here…" spellcheck="false"></textarea><div class="count" id="updated-count">0 lines</div></div>
</div>
<div class="actions">
<button type="submit" name="view" class="primary" disabled>View component changes <span aria-hidden="true">↗</span></button>
<button type="submit" name="download" disabled>Download HTML <span aria-hidden="true">↓</span></button>
</div>
<p role="status" id="status"></p>
</form>
<section id="results" class="rubric-report" aria-labelledby="report-title" hidden></section>
</main>
</body>
</html>
